# Bee SM — configuration commune
# Profil par défaut : développement local (API sur l'hôte, Mongo via Docker).
# Prod : SPRING_PROFILES_ACTIVE=prod (+ application-prod.properties).

spring.application.name=bee-sm
server.port=${SERVER_PORT:8090}

# --- MongoDB (local : container bee-sm-db, replica set rs0) ---
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/bee-sm-db?replicaSet=rs0&directConnection=true}
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.database=${MONGO_DATABASE:bee-sm-db}

# --- Dates / JSON (Jackson 3 / Spring Boot 4) ---
spring.jackson.time-zone=Africa/Douala
spring.jackson.datatype.datetime.write-dates-as-timestamps=false


# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# --- Sécurité ---
beesm.security.jwt.secret=${JWT_SECRET:local-dev-only-change-me-not-for-production-32c}
beesm.security.jwt.access-token-validity-ms=${JWT_ACCESS_TOKEN_VALIDITY_MS:900000}
beesm.security.jwt.refresh-token-validity-ms=${JWT_REFRESH_TOKEN_VALIDITY_MS:604800000}
beesm.security.lockout.max-failed-attempts=5
beesm.security.lockout.lock-duration-minutes=15
beesm.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Bootstrap SUPER_ADMIN (local uniquement ; laisser enabled=false en prod sauf premier déploiement)
beesm.security.bootstrap.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
beesm.security.bootstrap.username=${BOOTSTRAP_ADMIN_USERNAME:superadmin@bee-sm.local}
beesm.security.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:DemoPass123!}
beesm.security.bootstrap.school-id=${BOOTSTRAP_ADMIN_SCHOOL_ID:}

# Comptes mock tous rôles (docs/mock-logins.md) — DEV uniquement
beesm.security.mock-users.enabled=${MOCK_USERS_ENABLED:true}
beesm.security.mock-users.password=${MOCK_USERS_PASSWORD:DemoPass123!}
beesm.security.mock-users.school-id=${MOCK_USERS_SCHOOL_ID:school-elshammah}
beesm.security.mock-users.school-code=${MOCK_USERS_SCHOOL_CODE:ELSHAMMAH}

# Structure académique réelle du tenant El Shammah (docs/el-shammah-data/seed-el-shammah.json)
# insert-if-absent : les modifications UI survivent aux redémarrages.
beesm.seed.el-shammah.enabled=${EL_SHAMMAH_SEED_ENABLED:true}
beesm.seed.el-shammah.school-id=${EL_SHAMMAH_SEED_SCHOOL_ID:school-elshammah}
beesm.seed.el-shammah.resource=${EL_SHAMMAH_SEED_RESOURCE:classpath:seed/seed-el-shammah.json}
beesm.seed.el-shammah.overwrite-existing=${EL_SHAMMAH_SEED_OVERWRITE:false}

# EDT 2026-2027 privé (enseignants + cases) — hors Git (AGENTS.md règle 12)
beesm.seed.el-shammah-edt.enabled=${EL_SHAMMAH_EDT_SEED_ENABLED:true}
beesm.seed.el-shammah-edt.school-id=${EL_SHAMMAH_SEED_SCHOOL_ID:school-elshammah}
beesm.seed.el-shammah-edt.resource=${EL_SHAMMAH_EDT_SEED_RESOURCE:file:docs/seed-private/edt-2026-2027-extraction.json}
beesm.seed.el-shammah-edt.grid-resource=${EL_SHAMMAH_EDT_GRID_RESOURCE:file:docs/fixtures/timetable-grid.json}
beesm.seed.el-shammah-edt.overwrite-existing=${EL_SHAMMAH_EDT_SEED_OVERWRITE:false}
beesm.seed.el-shammah-edt.auto-heal-teacher-overlaps=${EL_SHAMMAH_EDT_AUTO_HEAL:true}

# Mot de passe temporaire à la création d'un compte lié à une fiche personnel (changement obligatoire)
beesm.security.provisioning.temporary-password=${STAFF_TEMP_PASSWORD:DemoPass123!}

# --- Logs (BR-43 : aucun identifiant d'élève ; pas de noms/mots de passe/jetons) ---
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{40} - %msg%n
logging.level.root=INFO
logging.level.com.kobe.beesm=DEBUG
logging.level.com.kobe.beesm.configuration.RequestLoggingWebFilter=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data.mongodb.core.ReactiveMongoTemplate=INFO
