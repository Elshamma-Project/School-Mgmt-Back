# SMELS — configuration commune
# Profil par défaut : développement local (API sur l'hôte, Mongo via Docker).
# Prod : SPRING_PROFILES_ACTIVE=prod (+ application-prod.properties).

spring.application.name=smels
server.port=${SERVER_PORT:8090}

# --- MongoDB (local : container smels-db, replica set rs0) ---
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/smels-db?replicaSet=rs0&directConnection=true}
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.database=${MONGO_DATABASE:smels-db}

# --- Dates / JSON ---
spring.jackson.time-zone=Africa/Douala
spring.jackson.serialization.write-dates-as-timestamps=false

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# --- Sécurité JWT (placeholders ; override via variables d'environnement) ---
smels.security.jwt.secret=${JWT_SECRET:local-dev-only-change-me-not-for-production}
smels.security.jwt.access-token-validity-ms=${JWT_ACCESS_TOKEN_VALIDITY_MS:900000}
smels.security.jwt.refresh-token-validity-ms=${JWT_REFRESH_TOKEN_VALIDITY_MS:604800000}

# --- Logs ---
logging.level.root=INFO
logging.level.com.kobe.smels=DEBUG
