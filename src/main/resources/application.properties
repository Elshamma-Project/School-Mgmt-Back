# SMELS — configuration commune
# Profil par défaut : développement local (API sur l'hôte, Mongo via Docker).
# Prod : SPRING_PROFILES_ACTIVE=prod (+ application-prod.properties).

spring.application.name=smels
server.port=${SERVER_PORT:8090}

# --- MongoDB (local : container smels-db, replica set rs0) ---
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/smels-db?replicaSet=rs0&directConnection=true}
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.database=${MONGO_DATABASE:smels-db}

# --- Dates / JSON (Jackson 3 / Spring Boot 4) ---
spring.jackson.time-zone=Africa/Douala
spring.jackson.datatype.datetime.write-dates-as-timestamps=false


# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# --- Sécurité ---
smels.security.jwt.secret=${JWT_SECRET:local-dev-only-change-me-not-for-production-32c}
smels.security.jwt.access-token-validity-ms=${JWT_ACCESS_TOKEN_VALIDITY_MS:900000}
smels.security.jwt.refresh-token-validity-ms=${JWT_REFRESH_TOKEN_VALIDITY_MS:604800000}
smels.security.lockout.max-failed-attempts=5
smels.security.lockout.lock-duration-minutes=15
smels.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Bootstrap SUPER_ADMIN (local uniquement ; laisser enabled=false en prod sauf premier déploiement)
smels.security.bootstrap.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
smels.security.bootstrap.username=${BOOTSTRAP_ADMIN_USERNAME:superadmin@smels.local}
smels.security.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:DemoPass123!}
smels.security.bootstrap.school-id=${BOOTSTRAP_ADMIN_SCHOOL_ID:}

# Comptes mock tous rôles (docs/mock-logins.md) — DEV uniquement
smels.security.mock-users.enabled=${MOCK_USERS_ENABLED:true}
smels.security.mock-users.password=${MOCK_USERS_PASSWORD:DemoPass123!}
smels.security.mock-users.school-id=${MOCK_USERS_SCHOOL_ID:school-elshammah}
smels.security.mock-users.school-code=${MOCK_USERS_SCHOOL_CODE:ELSHAMMAH}

# Structure académique réelle du tenant El Shammah (docs/el-shammah-data/seed-el-shammah.json)
# insert-if-absent : les modifications UI survivent aux redémarrages.
smels.seed.el-shammah.enabled=${EL_SHAMMAH_SEED_ENABLED:true}
smels.seed.el-shammah.school-id=${EL_SHAMMAH_SEED_SCHOOL_ID:school-elshammah}
smels.seed.el-shammah.resource=${EL_SHAMMAH_SEED_RESOURCE:classpath:seed/seed-el-shammah.json}
smels.seed.el-shammah.overwrite-existing=${EL_SHAMMAH_SEED_OVERWRITE:false}

# Mot de passe temporaire à la création d'un compte lié à une fiche personnel (changement obligatoire)
smels.security.provisioning.temporary-password=${STAFF_TEMP_PASSWORD:DemoPass123!}

# --- Logs (BR-43 : aucun identifiant d'élève ; pas de noms/mots de passe/jetons) ---
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{40} - %msg%n
logging.level.root=INFO
logging.level.com.kobe.smels=DEBUG
logging.level.com.kobe.smels.configuration.RequestLoggingWebFilter=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data.mongodb.core.ReactiveMongoTemplate=INFO
