# SMELS — profil production (activé via SPRING_PROFILES_ACTIVE=prod)

# Pas de création auto des index en prod (migrations dédiées).
spring.data.mongodb.auto-index-creation=false

# URI Mongo obligatoire via variable d'environnement (pas de défaut local).
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGO_DATABASE:smels-db}

# JWT : secret obligatoire en prod.
smels.security.jwt.secret=${JWT_SECRET}
smels.security.jwt.access-token-validity-ms=${JWT_ACCESS_TOKEN_VALIDITY_MS:900000}
smels.security.jwt.refresh-token-validity-ms=${JWT_REFRESH_TOKEN_VALIDITY_MS:604800000}
smels.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Bootstrap désactivé par défaut en prod
smels.security.bootstrap.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}

# Exposition minimale
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Logs (BR-43 : aucun identifiant d'élève)
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{40} - %msg%n
logging.level.root=WARN
logging.level.com.kobe.smels=INFO
logging.level.com.kobe.smels.configuration.RequestLoggingWebFilter=INFO
logging.level.org.springframework.data.mongodb=WARN
