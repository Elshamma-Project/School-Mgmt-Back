# Bee SM — profil production (activé via SPRING_PROFILES_ACTIVE=prod)

# Pas de création auto des index en prod (migrations dédiées).
spring.data.mongodb.auto-index-creation=false

# URI Mongo obligatoire via variable d'environnement (pas de défaut local).
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGO_DATABASE:bee-sm-db}

# JWT : secret obligatoire en prod.
beesm.security.jwt.secret=${JWT_SECRET}
beesm.security.jwt.access-token-validity-ms=${JWT_ACCESS_TOKEN_VALIDITY_MS:900000}
beesm.security.jwt.refresh-token-validity-ms=${JWT_REFRESH_TOKEN_VALIDITY_MS:604800000}
beesm.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Bootstrap / comptes mock désactivés par défaut en prod
beesm.security.bootstrap.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
beesm.security.mock-users.enabled=${MOCK_USERS_ENABLED:false}

# Seed académique El Shammah : insert-if-absent (sûr). Overwrite jamais en prod sauf action volontaire.
beesm.seed.el-shammah.enabled=${EL_SHAMMAH_SEED_ENABLED:true}
beesm.seed.el-shammah.overwrite-existing=${EL_SHAMMAH_SEED_OVERWRITE:false}

# Exposition minimale
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Logs (BR-43 : aucun identifiant d'élève)
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{40} - %msg%n
logging.level.root=WARN
logging.level.com.kobe.beesm=INFO
logging.level.com.kobe.beesm.configuration.RequestLoggingWebFilter=INFO
logging.level.org.springframework.data.mongodb=WARN
