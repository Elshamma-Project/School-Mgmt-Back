# Bee SM — environnement de production
# Usage (depuis setup/) :
#   docker compose -f compose.prod.yaml --env-file .env up -d --build
# Prérequis : renseigner setup/.env (voir .env.example).
#
# Noms Docker :
#   projet  : bee-sm-prod
#   conteneur : bee-sm-db, bee-sm-api
#   image   : bee-sm-api
#   volume / réseau : bee-sm-db-data, bee-sm-network
# Base Mongo : bee-sm-db (user bee_sm_admin)

name: bee-sm-prod

services:
  bee-sm-db:
    image: mongo:7.0
    container_name: bee-sm-db
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-bee-sm-db}
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - bee-sm-db-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'bee-sm-db:27017'}]}).ok }\" | grep 1",
        ]
      interval: 5s
      timeout: 15s
      retries: 12
      start_period: 20s
    networks:
      - bee-sm-network

  bee-sm-api:
    container_name: bee-sm-api
    build:
      context: ..
      dockerfile: setup/Dockerfile
    image: bee-sm-api:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      bee-sm-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: ${SERVER_PORT:-8090}
      MONGODB_URI: ${MONGODB_URI}
      MONGO_DATABASE: ${MONGO_DATABASE:-bee-sm-db}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_VALIDITY_MS: ${JWT_ACCESS_TOKEN_VALIDITY_MS:-900000}
      JWT_REFRESH_TOKEN_VALIDITY_MS: ${JWT_REFRESH_TOKEN_VALIDITY_MS:-604800000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-superadmin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      TZ: Africa/Douala
    ports:
      - "${SERVER_HOST_PORT:-8090}:${SERVER_PORT:-8090}"
    networks:
      - bee-sm-network

networks:
  bee-sm-network:
    name: bee-sm-network
    driver: bridge

volumes:
  bee-sm-db-data:
    name: bee-sm-db-data
