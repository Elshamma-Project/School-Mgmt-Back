# SMELS — environnement local
# Usage (depuis setup/) : docker compose up -d
# Ne lance QUE MongoDB. L'API tourne sur la machine hôte (./gradlew bootRun).

name: smels

services:
  smels-db:
    image: mongo:7.0
    container_name: smels-db
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - smels-db-data:/data/db
    healthcheck:
      # Initialise le replica set mono-nœud au premier démarrage (transactions Mongo).
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'localhost:27017'}]}).ok }\" | grep 1",
        ]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s
    networks:
      - smels-network

networks:
  smels-network:
    name: smels-network
    driver: bridge

volumes:
  smels-db-data:
    name: smels-db-data
