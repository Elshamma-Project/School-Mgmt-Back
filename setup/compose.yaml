# Bee SM — environnement local
# Usage :
#   depuis la racine : docker compose up -d
#   depuis setup/    : docker compose up -d
# Ne lance QUE MongoDB. L'API tourne sur la machine hôte (./gradlew bootRun).
#
# Noms Docker (après suppression des anciens smels-*) :
#   projet  : bee-sm
#   conteneur / volume / réseau : bee-sm-db, bee-sm-db-data, bee-sm-network
# Base Spring : bee-sm-db (voir application.properties / MONGODB_URI)

name: bee-sm

services:
  bee-sm-db:
    image: mongo:7.0
    container_name: bee-sm-db
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - bee-sm-db-data:/data/db
    healthcheck:
      # Initialise le replica set mono-nœud au premier démarrage (transactions Mongo).
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'localhost:27017'}]}).ok }\" | grep 1",
        ]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s
    networks:
      - bee-sm-network

networks:
  bee-sm-network:
    name: bee-sm-network
    driver: bridge

volumes:
  bee-sm-db-data:
    name: bee-sm-db-data
